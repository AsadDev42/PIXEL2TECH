name: Publish long-form video media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  property-film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install video encoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download the permitted original
        run: >-
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/property-original.mp4"
          'https://drive.usercontent.google.com/download?id=14FbZyV07YR5CflCLNKsnw6seH78-GTSo&export=download&confirm=t'
      - name: Create a streaming copy
        run: >-
          ffmpeg -hide_banner -nostdin -y -i "$RUNNER_TEMP/property-original.mp4"
          -map 0:v:0 -map '0:a:0?' -vf "scale=w='min(1280,iw)':h=-2"
          -c:v libx264 -preset veryfast -crf 25 -maxrate 1600k -bufsize 3200k
          -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart
          "$RUNNER_TEMP/interior-property-walkthrough.mp4"
      - name: Publish to the existing portfolio media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload portfolio-media-2026-10-23
          "$RUNNER_TEMP/interior-property-walkthrough.mp4"
          --repo '${{ github.repository }}'
